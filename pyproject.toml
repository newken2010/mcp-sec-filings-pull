[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-sec-filings-pull"
version = "0.1.0"
description = "MCP: SEC EDGAR public-filings pull — insider sales (Form 4), insider clusters, new insiders (Form 3), 13D/13G ownership, reporting calendar. Read-only public API, every row carries its EDGAR source link."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "mcp-sec-filings-pull" }]
dependencies = [
    "fastmcp>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mcp-sec-filings-pull = "main:main"

[tool.setuptools]
py-modules = ["main"]
packages = ["src", "src.tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]